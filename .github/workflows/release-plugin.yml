# 把插件本身打包成安装用的 tarball，并挂到同 tag 的 Release 上。
#
# 为什么需要：dsh 安装插件走的是 pnpm，而 `dsh plugin install <源码目录>` 会写成
# `link:` 依赖（Windows 上工具进程创建的 junction 不可遍历，会导致 pnpm 全面失效）。
# 因此给用户的正确形态是**一个 .tgz**，解包成真实目录 —— 这个工作流负责产出它。
#
# 与 release-binaries.yml 的关系：两者都由 `v*` tag 触发，各自往同一个 Release 追加
# 文件（softprops/action-gh-release 对已存在的 release 是更新而非失败）。
# 一个是「网关二进制」，一个是「插件本体」，互不依赖。

name: release-plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Run unit tests
        run: node node_modules/vitest/vitest.mjs run

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # tag 与包版本不一致会让用户装到「名字是 0.3.0 内容却是 0.2.0」的包。
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致"
            exit 1
          fi

      - name: Build lib/
        run: node node_modules/typescript/bin/tsc -p tsconfig.json

      - name: Assert build artifacts exist
        run: |
          # 防「假成功」：本仓库踩过 pnpm build 退出码 0 但 lib/ 没生成的坑。
          test -f lib/index.js
          test -f lib/zip.js
          test -f lib/gateway-binary.js
          test -f lib/login.js
          test -f lib/setup.js
          # 设置卡片的两半：宿主路由（lib/，tsc 产物）+ 浏览器半边（client/，手写源文件）。
          # 缺了它们插件照样能跑（卡片不出现），所以【必须】在这里挡住，
          # 否则会发出一个「没有卡片的版本」而 CI 全绿。
          # ★ client/ 不是构建产物：tsconfig 的 include 只有 src/，没人会重新生成它 ——
          #   它要是没进检出，下面这行就是唯一的报警器。
          test -f lib/api.js
          test -f client/client.js
          # 墓碑状态与启动轨迹：缺了会静默降级，同样值得挡住。
          test -f lib/plugin-state.js
          test -f lib/boot-trace.js

      - name: Pack tarball
        run: |
          # --ignore-scripts：prepack 会再跑一次 tsc，这里已显式构建过。
          #
          # mkdir 是必需的：dist/ 被 .gitignore 忽略，全新检出时**不存在**，
          # 而 `npm pack --pack-destination dist` 不会自己建目录（实测 CI 上
          # 报 ENOENT 退出 254）。本机之所以没暴露，只是因为本地 dist/ 早就在了。
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          # ★ 另外产出一份【不带版本号】的副本。
          #
          # 为什么：插件市场上架要求 tarball 的 URL 稳定，而
          # `releases/latest/download/<asset>` 是按【资产文件名】取最新 release 的 ——
          # 文件名里带版本号的话，下一次发版资产改名，旧链接会【静默 404】
          # （不是报错，是下载不到）。所以固定名那份专供 latest/download 使用；
          # 带版本号那份留给用户按版本下载。
          #
          # rm 是必需的：本机重复跑时 glob 会匹配到上一轮的副本，`cp a b dest` 报错。
          rm -f dist/plugin-latest.tgz
          cp dist/*.tgz dist/plugin-latest.tgz
          ls -l dist

      - name: Assert tarball contents
        run: |
          # 安装包必须自带 cordis.patch.yml（插件靠它挂进 profile 的 bundle 层），
          # 且不应把源码/测试打进去。
          #
          # 注意 dist/ 现在有两个 .tgz（固定名 + 带版本号），内容相同 —— 取其一检查。
          PKG_TGZ="$(ls dist/*.tgz | head -1)"
          echo "检查 $PKG_TGZ"
          tar -tzf "$PKG_TGZ" | sort | tee /tmp/contents.txt
          grep -q 'package/cordis.patch.yml' /tmp/contents.txt
          grep -q 'package/lib/index.js' /tmp/contents.txt
          # 设置卡片的浏览器半边必须打进包 —— 否则发出去的是「没有卡片的版本」。
          grep -q 'package/client/client.js' /tmp/contents.txt
          grep -q 'package/lib/api.js' /tmp/contents.txt
          # 反向断言：files[] 同时含 lib 与 client 时，若还有一份 lib/client.js 残留在
          # 构建目录里，tarball 会把它一起打进去 —— 两份"浏览器半边"谁生效说不清。
          if grep -q 'package/lib/client.js' /tmp/contents.txt; then
            echo "::error::tarball 里不应再有 lib/client.js（与 client/client.js 重复）"; exit 1
          fi
          if grep -q 'package/src/' /tmp/contents.txt; then
            echo "::error::tarball 里不应包含 src/"; exit 1
          fi

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-tarball
          path: dist/*.tgz
          if-no-files-found: error

      - name: Publish tarball to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          # 这个 job 不负责写 release 说明，避免与 release-binaries 互相覆盖。
          append_body: true
